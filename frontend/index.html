<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TaskNest Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h2>Login to TaskNest</h2>

  <input type="email" id="email" placeholder="Email" />
  <br /><br />

  <input type="password" id="password" placeholder="Password" />
  <br /><br />

  <button id="loginBtn">Login</button>

  <p id="message"></p>

  <script src="app.js"></script>
</body>
</html>

{% comment %} 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>TaskNest Dashboard</h1>
  <script src="app.js"></script>
  <div id="stats"></div>

<div id="filters" style="margin: 20px 0;">
  <button onclick="loadTasks()">All</button>
  <button onclick="loadTasks('completed')">Completed</button>
  <button onclick="loadTasks('pending')">Pending</button>
</div>

<div id="taskList"></div>

</body>
</html> {% endcomment %}
